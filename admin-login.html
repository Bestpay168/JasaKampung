<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login Admin — JASA KAMPUNG</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>

<body class="admin-login-page">

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">
                JK
            </div>

            <h1>
                JASA KAMPUNG
            </h1>

            <p class="login-subtitle">
                Admin Dashboard
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="admin@jasakampung.com"
                        required
                        autocomplete="email"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Masuk ke Dashboard
                </button>

            </form>


            <p
                id="loginMessage"
                class="login-message"
            ></p>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin-login.js"></script>

</body>

</html>
